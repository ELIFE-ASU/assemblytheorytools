# Read the Docs configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  # Fail the build on any Sphinx warning; a broken docstring or an
  # unimportable module must not ship as a silently empty page.
  fail_on_warning: true

python:
  install:
    # autodoc imports the real package, so install it with its runtime
    # dependencies plus the docs extra.
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip
