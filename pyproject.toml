[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "assemblytheorytools"
version = "1.15.0"
description = "A centralised set of tools for doing assembly theory calculations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
    { name = "et al." },
]

keywords = [
    "assembly theory",
    "assembly index",
    "molecular complexity",
    "cheminformatics",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "ase>=3.23.0",
    "numpy>=2.1.3",
    "scipy>=1.15.1",
    "pandas>=2.2.3",
    "matplotlib>=3.9.2",
    "networkx>=3.4.2",
    "rdkit>=2024.03.5",
    "ipython>=8.30.0",
    "pyvis>=0.3.2",
    "pubchempy>=1.0.5",
    "cairosvg>=2.8.2",
    "pillow>=10.1.0",
    "dagviz>=0.5.0",
    "assembly-theory>=0.6.0",
    "assemblycfg>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=4.0",
]

[project.urls]
Homepage = "https://github.com/ELIFE-ASU/assemblytheorytools"
Repository = "https://github.com/ELIFE-ASU/assemblytheorytools"
Issues = "https://github.com/ELIFE-ASU/assemblytheorytools/issues"
Changelog = "https://github.com/ELIFE-ASU/assemblytheorytools/releases"

[tool.setuptools.packages.find]
include = ["assemblytheorytools*"]

[tool.setuptools.package-data]
"assemblytheorytools" = ["precompiled/*", "data/*"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "integration: requires a live service, external dataset, or external executable",
    "slow: takes long enough to exclude from the normal development loop",
]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["assemblytheorytools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
