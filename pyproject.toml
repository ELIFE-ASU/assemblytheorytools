[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "assemblytheorytools"
version = "1.17.0"
description = "A centralised set of tools for doing assembly theory calculations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
    { name = "et al." },
]

keywords = [
    "assembly theory",
    "assembly index",
    "molecular complexity",
    "cheminformatics",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "ase>=3.23.0",
    # The Rust search API is version-sensitive (timeout and max_pathways).
    # Upgrade this pin only after exercising the backend tests.
    "assembly-theory==0.7.0",
    "assemblycfg>=1.2.2",
    "cairosvg>=2.8.2",
    "dagviz>=0.5.0",
    "filelock>=3.16",
    "ipython>=8.30.0",
    "matplotlib>=3.9.2",
    "networkx>=3.4.2",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "pillow>=10.1.0",
    "pubchempy>=1.0.5",
    "pydot>=3.0.1",
    "pyvis>=0.3.2",
    "rdkit>=2024.03.5",
    "scipy>=1.15.1",
    # Required for the C++ calculator's on-demand build, not the Python wheel.
    # Git and a C++20 compiler are supplied by the host (or Conda environment).
    "cmake>=3.25",
    "ninja",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=4.0",
    "myst-nb>=1.4",
]
notebooks = [
    "jupyterlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/ELIFE-ASU/assemblytheorytools"
Repository = "https://github.com/ELIFE-ASU/assemblytheorytools"
Issues = "https://github.com/ELIFE-ASU/assemblytheorytools/issues"
Changelog = "https://github.com/ELIFE-ASU/assemblytheorytools/releases"

# Install repository tooling with pip >=25.1: pip install --group build --group lint.
# These groups are not runtime requirements or published package extras.
[dependency-groups]
build = [
    "build>=1.2.2",
    "twine>=6.1",
]
lint = [
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["assemblytheorytools", "assemblytheorytools.*"]
namespaces = false

[tool.setuptools.package-data]
"assemblytheorytools" = ["data/integer_chain_9999.txt", "data/test_molecule_data.csv"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Syntax errors, undefined names and invalid comparisons; match the CI gate.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "integration: requires a live service, external dataset, or external executable",
    "slow: takes long enough to exclude from the normal development loop",
]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # pydot's DOT parser calls pyparsing's old camelCase API
    "ignore:'set.*Action' deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["assemblytheorytools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
