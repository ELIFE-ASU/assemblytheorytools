# Keep the pinned action versions current.
#
# Python dependencies use open-ended lower bounds, except assembly-theory's
# deliberate API-compatibility pin, which is upgraded with the backend tests.
# The weekly tests.yml run checks for regressions in newly resolved versions.
# Build and lint requirements are maintained in pyproject.toml dependency groups.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One pull request for all of them rather than four.
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies
    commit-message:
      prefix: ci
