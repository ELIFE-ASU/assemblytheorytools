# Build the distributions and check they are installable and complete.
#
# Nothing here publishes anything: the point is that a packaging mistake shows
# up on the pull request that introduced it rather than at release time, when
# the only fix is a new version number. python-publish.yml reuses this same
# workflow so the files uploaded to PyPI are the ones that passed these checks.

name: Packaging

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Read the declared version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        # `build` makes the sdist first and then builds the wheel *from* it, so
        # a file missing from MANIFEST.in fails here rather than reaching PyPI.
        run: python -m build

      - name: Check the distribution metadata
        # --strict fails on a README that PyPI would refuse to render.
        run: twine check --strict dist/*

      - name: Check the package data is present and still executable
        # The assembly binaries under precompiled/ are shelled out to at
        # runtime, so both their presence and their mode bits matter. Neither
        # is covered by an editable install, which is what every other job
        # uses, so this is the only place the shipped layout is verified.
        run: |
          python - <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          REQUIRED = [
              "assemblytheorytools/precompiled/asscpp_combined_static_linux",
              "assemblytheorytools/precompiled/asscpp_combined_static_strings",
              "assemblytheorytools/precompiled/asscpp_public_static_linux",
              "assemblytheorytools/data/integer_chain_9999.txt",
              # Read at import time by tools_test, so a wheel without it
              # cannot even be imported.
              "assemblytheorytools/data/test_molecule_data.csv",
          ]
          EXECUTABLE = [name for name in REQUIRED if "/precompiled/" in name]

          failures = []

          (wheel,) = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              modes = {i.filename: i.external_attr >> 16 for i in archive.infolist()}
          for name in REQUIRED:
              if name not in names:
                  failures.append(f"{wheel.name} is missing {name}")
          for name in EXECUTABLE:
              if name in names and not modes[name] & 0o111:
                  failures.append(f"{wheel.name} lost the executable bit on {name}")

          (sdist,) = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              root = f"{sdist.name.removesuffix('.tar.gz')}/"
              names = set(archive.getnames())
          for name in REQUIRED:
              if root + name not in names:
                  failures.append(f"{sdist.name} is missing {name}")
          # The suite ships in the sdist only (see MANIFEST.in).
          if not any(n.startswith(root + "tests/") for n in names):
              failures.append(f"{sdist.name} is missing the test suite")

          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY

      - name: List the built distributions
        run: ls -l dist/

      - name: Upload the built distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          retention-days: 7

  install:
    name: Install the wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported interpreters. A dependency with no wheel
        # yet on the newest one fails here rather than on a user's
        # `pip install assemblytheorytools`.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Retrieve the built distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Install the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Smoke-test the installed package
        # There is deliberately no checkout, so the import below can only
        # resolve to the installed wheel and not to a source tree beside it.
        # The assembly index call shells out to the bundled binary, making this
        # the end-to-end check that the executable shipped, kept its mode bits
        # and runs.
        env:
          MPLBACKEND: Agg
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os

          from rdkit import Chem

          import assemblytheorytools as att

          expected = os.environ["EXPECTED_VERSION"]
          assert att.__version__ == expected, f"{att.__version__} != {expected}"

          index, *_ = att.calculate_assembly_index(Chem.MolFromSmiles("CCO"))
          assert isinstance(index, int) and index >= 0, index

          print(f"assemblytheorytools {att.__version__} installs and runs; MA(ethanol) = {index}")
          PY
