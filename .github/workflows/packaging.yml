# Build the distributions and check they are installable and complete.
#
# Nothing here publishes anything: the point is that a packaging mistake shows
# up on the pull request that introduced it rather than at release time, when
# the only fix is a new version number. python-publish.yml reuses this same
# workflow so the files uploaded to PyPI are the ones that passed these checks.

name: Packaging

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group build

      - name: Read the declared version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        # `build` makes the sdist first and then builds the wheel *from* it, so
        # a file missing from MANIFEST.in fails here rather than reaching PyPI.
        run: python -m build

      - name: Check the distribution metadata
        # --strict fails on a README that PyPI would refuse to render.
        run: twine check --strict dist/*

      - name: Check the package data is present and no binaries crept back in
        # An editable install, which every other job uses, does not exercise
        # the shipped layout, so this is the only place it is verified. The
        # C++ calculator is deliberately not distributed: it is built from
        # parallelassemblycpp on demand, and its CC BY-NC licence is incompatible
        # with shipping it inside this MIT package.
        run: |
          python - <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          REQUIRED = [
              "assemblytheorytools/data/integer_chain_9999.txt",
              # Read at import time by tools_test, so a wheel without it
              # cannot even be imported.
              "assemblytheorytools/data/test_molecule_data.csv",
          ]
          FORBIDDEN_PREFIX = "assemblytheorytools/precompiled/"

          failures = []

          def check(label, names, root=""):
              for name in REQUIRED:
                  if root + name not in names:
                      failures.append(f"{label} is missing {name}")
              for name in sorted(names):
                  if name.removeprefix(root).startswith(FORBIDDEN_PREFIX):
                      failures.append(f"{label} ships a precompiled binary: {name}")

          (wheel,) = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          check(wheel.name, names)
          if any(n.startswith("tests/") for n in names):
              failures.append(f"{wheel.name} ships the test suite")
          if not any(n.endswith(".dist-info/licenses/LICENSE") for n in names):
              failures.append(f"{wheel.name} is missing LICENSE")

          (sdist,) = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              names = set(archive.getnames())
          root = f"{sdist.name.removesuffix('.tar.gz')}/"
          check(sdist.name, names, root)
          if root + "LICENSE" not in names:
              failures.append(f"{sdist.name} is missing LICENSE")
          # The suite ships in the sdist only (see MANIFEST.in).
          if not any(n.startswith(root + "tests/") for n in names):
              failures.append(f"{sdist.name} is missing the test suite")

          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY

      - name: List the built distributions
        run: ls -l dist/

      - name: Upload the built distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          retention-days: 7

  install:
    name: Install the wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported interpreters. A dependency with no wheel
        # yet on the newest one fails here rather than on a user's
        # `pip install assemblytheorytools`.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Retrieve the built distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Install the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip check

      - name: Smoke-test the installed package
        # There is deliberately no checkout, so the import below can only
        # resolve to the installed wheel and not to a source tree beside it.
        # The calculation uses the Rust backend, which arrives as a declared
        # dependency, so this job proves the wheel installs and computes
        # without needing a C++ toolchain. The C++ backend is covered by
        # tests.yml, which builds it from parallelassemblycpp.
        env:
          MPLBACKEND: Agg
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os

          from rdkit import Chem

          import assemblytheorytools as att

          expected = os.environ["EXPECTED_VERSION"]
          assert att.__version__ == expected, f"{att.__version__} != {expected}"

          index = att.calculate_assembly_index_rust(Chem.MolFromSmiles("CCO"))
          assert isinstance(index, int) and index >= 0, index

          print(f"assemblytheorytools {att.__version__} installs and runs; MA(ethanol) = {index}")
          PY
