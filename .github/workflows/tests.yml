# Run the test suite on every supported interpreter.
#
# The default `pytest` run needs no network services, no external datasets and
# no ORCA: conftest.py skips the `integration` and `slow` groups unless their
# opt-in flag is passed. It does need the C++ calculator, which is no longer
# shipped as a binary, so each job builds it first with the local composite
# action and points ASS_PATH at the result. The opt-in groups are exercised
# separately by the weekly job below.

name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # Called by python-publish.yml so a release runs the suite against the
  # tagged commit before anything is uploaded.
  workflow_call:
  schedule:
    # Monday 05:00 UTC. Catches breakage from unpinned dependencies (rdkit,
    # pandas and scipy have all broken this package on a minor release) and
    # from drift in the live services the integration tests call.
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group lint

      # Deliberately a narrow rule set: syntax errors (E9), undefined names
      # (F82) and always-wrong comparisons (F63, F7). These are bugs rather
      # than style, so the gate is green today without first reformatting the
      # whole codebase; widen the selection once that backlog is cleared.
      - name: Check for syntax errors and undefined names
        # Use the shared configuration in pyproject.toml. The GitHub output
        # format annotates the offending lines in the pull-request diff.
        run: ruff check --output-format=github .

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Generous for Windows, which builds both assembly-theory and the C++
    # calculator from source on a cold cache. The other platforms finish in
    # a few minutes.
    timeout-minutes: 60

    defaults:
      run:
        # Windows would otherwise run these in PowerShell, which only reports
        # the last command's exit status, so a failing install would be noticed
        # one step too late. Git Bash is on the image and keeps every job's
        # steps identical.
        shell: bash

    strategy:
      # One failing interpreter should not hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Smoke-test the other supported platforms. macOS runners are arm64,
          # which is the only macOS wheel assembly-theory publishes.
          - os: macos-latest
            python-version: "3.13"
          # Windows is the slow one: assembly-theory publishes no Windows wheel,
          # so pip builds it from its Rust sdist, and the C++ calculator is
          # built by MSVC through CMake's Visual Studio generator rather than
          # Ninja. Both land in caches, so only a cold run pays full price.
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Report the Rust toolchain
        # assembly-theory publishes no Windows wheel, so pip builds it from the
        # sdist with maturin. The runner image supplies Rust; say which version,
        # because that is the first thing to check when the build fails.
        if: runner.os == 'Windows'
        run: |
          rustc --version
          cargo --version

      - name: Install the Cairo system library
        # cairosvg is a pip dependency but binds Cairo through cffi, and pip
        # does not supply that library. The Linux images already ship it; on
        # macOS Homebrew installs outside dyld's default search path, so the
        # fallback path has to name it or the import fails with OSError and the
        # metro-plot test skips itself. Windows has no comparable one-line
        # install, so there the metro-plot test takes that skip.
        if: runner.os == 'macOS'
        run: |
          brew install cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:$HOME/lib:/usr/local/lib:/usr/lib" >> "$GITHUB_ENV"

      - name: Install the package and its test dependencies
        # Editable so coverage paths line up with the checkout. The runtime
        # dependency set is large (rdkit, ase, ...); the pip cache above keeps
        # repeat runs cheap.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Report the resolved dependency versions
        # Dependencies are unpinned, so the failing version is the first thing
        # anyone needs when a scheduled run goes red.
        run: python -m pip list

      - name: Build the C++ calculator
        # After the install step, so it uses the cmake and ninja the package
        # declares as dependencies.
        uses: ./.github/actions/parallelassemblycpp

      - name: Run the test suite
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload the coverage report
        # One report is enough; they only differ by interpreter.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  opt-in-groups:
    # The integration and slow groups, which the pull-request runs skip. Live
    # PubChem lookups and the long assembly calculations belong here, not on
    # the critical path of a review. Tests needing ORCA or the Chemotion
    # archive skip themselves when those are absent, which they are here.
    name: Integration and slow tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Build the C++ calculator
        uses: ./.github/actions/parallelassemblycpp

      - name: Run the integration and slow tests
        run: pytest --run-integration --run-slow -m "integration or slow" -ra
